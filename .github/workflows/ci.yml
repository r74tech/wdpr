name: CI

on:
  pull_request:
    branches: [develop, release]
  push:
    branches-ignore: [release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run lint

      - run: bun run format

      - run: bun run typecheck

      - run: bun test
