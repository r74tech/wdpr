name: Release

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  discover:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.tags.outputs.count }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Discover release tags
        id: tags
        run: |
          set -euo pipefail

          tags_file="$RUNNER_TEMP/wdpr-release-tags"
          : > "$tags_file"

          provenance_commit() {
            local package="$1"
            local version="$2"
            local payload

            payload="$(curl --fail --silent --show-error \
              "https://registry.npmjs.org/-/npm/v1/attestations/@wdprlib%2f$package@$version" | \
              jq -er '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload')"

            printf '%s' "$payload" | base64 --decode | jq -er --arg repository \
              "git+https://github.com/${{ github.repository }}@" \
              '[.predicate.buildDefinition.resolvedDependencies[] | select(.uri | startswith($repository)) | .digest.gitCommit][0]'
          }

          before="${{ github.event.before }}"
          if [[ "$before" != "0000000000000000000000000000000000000000" ]]; then
            while IFS= read -r commit; do
              if [[ "$commit" == "$(git rev-parse HEAD)" ]]; then
                continue
              fi

              for package in ast parser render decompiler runtime; do
                while IFS= read -r tag; do
                  if [[ -n "$tag" ]]; then
                    version="${tag##*@}"
                    if [[ "$(npm view "@wdprlib/$package@$version" version 2>/dev/null || true)" != "$version" ]]; then
                      echo "::error::Unpublished release tag is not on the pushed develop HEAD: $tag"
                      exit 1
                    fi

                    published_commit="$(provenance_commit "$package" "$version")"
                    if [[ "$published_commit" != "$commit" ]]; then
                      echo "::error::Published provenance commit does not match release tag $tag"
                      exit 1
                    fi
                  fi
                done < <(git tag --points-at "$commit" --list "@wdprlib/$package@*")
              done
            done < <(git rev-list "$before..HEAD")
          fi

          for package in ast parser render decompiler runtime; do
            while IFS= read -r tag; do
              if [[ -n "$tag" ]]; then
                if [[ "$(git log -1 --format=%s HEAD)" != "chore(release): publish" ]]; then
                  echo "::error::Release tag is not attached to a release commit: $tag"
                  exit 1
                fi

                if [[ "$(git cat-file -t "$tag")" != "tag" ]]; then
                  echo "::error::Release tag must be annotated: $tag"
                  exit 1
                fi

                if [[ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
                  echo "::error::Release tag does not resolve to the tested commit: $tag"
                  exit 1
                fi

                printf '%s\n' "$tag" >> "$tags_file"
              fi
            done < <(git tag --points-at HEAD --list "@wdprlib/$package@*")
          done

          tags="$(jq -R -s -c 'split("\n") | map(select(length > 0))' "$tags_file")"
          count="$(jq 'length' <<< "$tags")"

          if [[ "$count" == "0" ]]; then
            echo "No release tags found on the tested develop commit."
          else
            echo "Release tags: $tags"
          fi

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  release:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAGS: ${{ needs.discover.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Resolve workspace dependencies
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "Resolving deps for $pkg"
              (cd "$pkg" && node ../../scripts/resolve-workspace-deps.js)
            fi
          done

      - name: Publish to npm (OIDC Trusted Publishing)
        run: |
          set -euo pipefail

          provenance_commit() {
            local package="$1"
            local version="$2"
            local payload

            payload="$(curl --fail --silent --show-error \
              "https://registry.npmjs.org/-/npm/v1/attestations/@wdprlib%2f$package@$version" | \
              jq -er '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload')"

            printf '%s' "$payload" | base64 --decode | jq -er --arg repository \
              "git+https://github.com/${{ github.repository }}@" \
              '[.predicate.buildDefinition.resolvedDependencies[] | select(.uri | startswith($repository)) | .digest.gitCommit][0]'
          }

          while IFS= read -r tag; do
            scoped="${tag%@*}"
            package="${scoped#@wdprlib/}"
            version="${tag##*@}"
            directory="packages/$package"
            publish_tag="latest"

            case "$package" in
              ast|parser|render|decompiler|runtime) ;;
              *)
                echo "::error::Unsupported package in release tag: $tag"
                exit 1
                ;;
            esac

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version in release tag: $tag"
              exit 1
            fi

            if [[ "$version" == *-* ]]; then
              publish_tag="${version#*-}"
              publish_tag="${publish_tag%%.*}"
              publish_tag="${publish_tag%%+*}"
              if [[ "$publish_tag" =~ ^[0-9] ]]; then
                publish_tag="next"
              fi
            fi

            if [[ "$(npm view "$scoped@$version" version 2>/dev/null || true)" == "$version" ]]; then
              published_commit="$(provenance_commit "$package" "$version")"
              if [[ "$published_commit" != "$(git rev-parse HEAD)" ]]; then
                echo "::error::Published provenance commit does not match release tag $tag"
                exit 1
              fi

              echo "Already published, skipping: $scoped@$version"
              continue
            fi

            previous_tag="$(git tag --merged HEAD^ --list "$scoped@*" --sort=-version:refname | head -n 1)"
            if [[ -n "$previous_tag" ]]; then
              previous_version="${previous_tag##*@}"
              for attempt in {1..60}; do
                if [[ "$(npm view "$scoped@$previous_version" version 2>/dev/null || true)" == "$previous_version" ]]; then
                  previous_commit="$(git rev-parse "$previous_tag^{commit}")"
                  published_commit="$(provenance_commit "$package" "$previous_version")"
                  if [[ "$published_commit" != "$previous_commit" ]]; then
                    echo "::error::Published provenance commit does not match previous release tag $previous_tag"
                    exit 1
                  fi

                  break
                fi

                if [[ "$attempt" == "60" ]]; then
                  echo "::error::Previous release was not published: $scoped@$previous_version"
                  exit 1
                fi

                echo "Waiting for previous release: $scoped@$previous_version"
                sleep 10
              done
            fi

            manifest_name="$(jq -r '.name' "$directory/package.json")"
            manifest_version="$(jq -r '.version' "$directory/package.json")"
            if [[ "$manifest_name" != "$scoped" ]]; then
              echo "::error::Tag package $scoped does not match manifest name $manifest_name"
              exit 1
            fi

            if [[ "$manifest_version" != "$version" ]]; then
              echo "::error::Tag version $version does not match $scoped manifest version $manifest_version"
              exit 1
            fi

            echo "Publishing: $scoped@$version from $directory with dist-tag $publish_tag"
            (cd "$directory" && npm publish --access public --tag "$publish_tag")
          done < <(jq -r '.[]' <<< "$RELEASE_TAGS")
        env:
          NPM_CONFIG_PROVENANCE: true
